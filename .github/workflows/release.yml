name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Normalize hosted Python permissions
        shell: bash
        run: |
          runtime="$(python -c 'import pathlib, sys; print(pathlib.Path(sys.executable).resolve())')"
          sudo chmod go-w "$runtime"
      - name: Validate tag and release
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(python -c 'import json; print(json.load(open(".codex-plugin/plugin.json"))["version"])')"
          python -m unittest discover -s tests -v
          python scripts/validate_release.py .
      - name: Build reproducible archive
        if: matrix.os == 'ubuntu-latest'
        run: python scripts/build_release.py --output dist
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: release-artifacts
          path: dist/*

  publish:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: dist
      - name: Publish immutable tag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="dist/codex-profile-harness-${version}.tar.gz"
          checksum="${archive}.sha256"
          test -f "$archive"
          test -f "$checksum"
          gh release create "$GITHUB_REF_NAME" "$archive" "$checksum" --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
