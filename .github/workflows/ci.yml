name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Compile
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m compileall -q -f bin scripts src tests
          find bin scripts src tests -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          find bin scripts src tests -type d -name '__pycache__' -empty -delete
      - name: Standalone plugin and skill contract validation with release smoke
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/validate_release.py
      - name: Reproducible release archive
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python scripts/build_release.py --output dist-one
          python scripts/build_release.py --output dist-two
          cmp dist-one/codex-profile-harness-*.tar.gz dist-two/codex-profile-harness-*.tar.gz
          cmp dist-one/codex-profile-harness-*.sha256 dist-two/codex-profile-harness-*.sha256
      - name: Artifact hygiene
        run: |
          test -z "$(find . -name '.DS_Store' -o -name '*.pyc' -o -name '*.pyo')"
          ! find . -type f -size +1M -print -quit | grep -q .
